name: Build APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    # FIX 1: Pin to ubuntu-22.04 to avoid Docker/Android SDK conflicts on 24.04
    runs-on: ubuntu-22.04 
    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        # FIX 2: Pin to a specific version instead of @v1 (which might be broken)
        uses: ArtemSBulgakov/buildozer-action@v1.1.4
        id: buildozer
        with:
          command: android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradingbot-apk
          path: ${{ steps.buildozer.outputs.filename }}
