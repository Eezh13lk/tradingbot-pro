name: Build APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            -w /home/user/hostcwd \
            kivy/buildozer:0.46 \
            android debug

      - name: Find APK path
        id: find_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradingbot-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
