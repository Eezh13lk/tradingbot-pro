name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Clean previous state
        run: rm -rf .buildozer bin ~/.buildozer

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Show tail of build log
        if: always()
        run: tail -n 80 build.log || true

      - name: Check if APK was produced
        if: always()
        run: |
          echo "=== Contents of bin/ ==="
          ls -la bin/ || echo "bin/ does not exist"
          echo "=== Searching for any apk ==="
          find . -name "*.apk" -not -path "./.buildozer/*" || true

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK (if it exists)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tradingbot-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30