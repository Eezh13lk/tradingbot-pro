name: Build APK
on: [push, workflow_dispatch]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        run: |
          docker run --rm -v "${{ github.workspace }}":/home/user/hostcwd kivy/buildozer:latest android debug

      - name: Find APK path
        id: find_apk
        # Search the ENTIRE workspace for any .apk file
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "DEBUG: Found APK at: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tradingbot-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
